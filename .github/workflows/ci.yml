name: CI - Alvaro Rodriguez Suarez

on:
    push:
        branches: ["main"]

jobs:
    backend:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

        # AÑADIR PASO PARA EJECUTAR TEST UNITARIOS CUANDO SE CREEN

    frontend:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Build
              run: npm run build


    e2e:
        runs-on: ubuntu-24.04
        needs: [frontend]
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: kanbancareer
                    POSTGRES_PASSWORD: kanbancareer
                    POSTGRES_DB: kanbancareer
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              run: npm ci

            - name: Install backend dependencies
              run: npm ci
              working-directory: backend

            - name: Run Prisma migrations
              run: npx prisma migrate deploy
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://kanbancareer:kanbancareer@localhost:5432/kanbancareer

            - name: Start backend server
              run: |
                  node src/server.js &
                  echo "BACKEND_PID=$!"
                  for i in $(seq 1 20); do
                    curl -s http://localhost:3000/health > /dev/null && echo "Backend ready" && break
                    echo "Waiting for backend... attempt $i"
                    sleep 2
                  done
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://kanbancareer:kanbancareer@localhost:5432/kanbancareer

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npm run test:ci
              env:
                  CI: true
                  DATABASE_URL: postgresql://kanbancareer:kanbancareer@localhost:5432/kanbancareer

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                    name: playwright-report
                    path: frontend/playwright-report/
