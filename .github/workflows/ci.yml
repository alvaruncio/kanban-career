name: CI - Alvaro Rodriguez Suarez


on:
    push:
        branches: ["main"]


jobs:
    backend:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: backend

        steps:
        -   name:   Checkout Repository
            uses:   actions/checkout@v7

        -   name: Setup Node.js
            uses: actions/setup-node@v6
            with:
                node-version: 24.18.0
                cache: npm
                cache-dependency-path: backend/package-lock.json
        
        -   name: Install dependencies
            run: npm ci
        
        -   name: Run lint
            run: npm run lint


        # AÑADIR PASO PARA EJECUTAR TEST UNITARIOS CUANDO SE CREEN

    frontend:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: frontend

        steps:
        -   name:   Checkout Repository
            uses:   actions/checkout@v7

        -   name: Setup Node.js
            uses: actions/setup-node@v6
            with:
                node-version: 24.18.0
                cache: npm
                cache-dependency-path: frontend/package-lock.json
        
        -   name: Install dependencies
            run: npm ci
        
        -   name: Run lint
            run: npm run lint
            
        # AÑADIR PASO PARA EJECUTAR TESTS CON PLAYWRIGHT CUANDO SE CREEN
